[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-trace"
version = "0.2.0"
description = "Explains what AWS IAM policies allow: decisions with traces, semantic diffs, escalation paths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# No runtime dependencies on purpose: the engine must run offline and inside Pyodide.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
# Only needed for the live differential run against the AWS policy simulator.
differential = ["boto3>=1.34"]

[project.scripts]
iam-trace = "iamtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iamtrace = ["py.typed", "data/*.json", "catalog/data/*.json", "catalog/data/services/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "live: calls the AWS policy simulator; never runs in normal CI",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/iamtrace"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
