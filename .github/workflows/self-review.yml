# Runs this repository's own GitHub Action on pull requests that change the example policies,
# so the action is exercised exactly the way users run it.
name: self-review

on:
  pull_request:
    paths:
      - "examples/policies/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./action
        with:
          paths: "examples/policies/*.json"
          fail-on-escalation: "true"
