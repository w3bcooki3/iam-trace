# Runs this repository's own GitHub Action on pull requests that change the example policies,
# so the action is exercised exactly the way users run it.
name: self-review

on:
  pull_request:
    paths:
      - "examples/policies/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./action
        with:
          paths: "examples/policies/*.json"
          fail-on-escalation: "true"
