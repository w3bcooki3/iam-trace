# Publishes a release when a version tag is pushed:
#
#     git tag v0.3.0 && git push origin v0.3.0
#
# 1. build: checks the tag matches pyproject.toml and CHANGELOG.md has a dated section for it,
#    runs every check, and builds the sdist and wheel.
# 2. pypi: uploads to PyPI with trusted publishing (OpenID Connect, no stored token) and
#    signed attestations. One-time setup on pypi.org is described in CONTRIBUTING.md.
# 3. github: creates the GitHub release with the files and the changelog section as notes.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" "build>=1.2,<2" "twine>=6,<7"
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import iamtrace; print(iamtrace.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - name: Changelog has a dated section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py "$TAG" > /dev/null
      - name: Checks
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest -q
      - name: Build
        run: |
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/iam-trace/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python scripts/release_notes.py "$TAG" > notes.md
          gh release create "$TAG" dist/* --repo "$REPO" --title "iam-trace ${TAG#v}" --notes-file notes.md
