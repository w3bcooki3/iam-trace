# Publishes a release when a version tag is pushed:
#
#     git tag v0.3.0 && git push origin v0.3.0
#
# 1. build: checks the tag matches pyproject.toml and CHANGELOG.md has a dated section for it,
#    runs every check, and builds the sdist and wheel.
# 2. pypi: uploads to PyPI with trusted publishing (OpenID Connect, no stored token) and
#    signed attestations. One-time setup on pypi.org is described in CONTRIBUTING.md.
# 3. github: creates the GitHub release with the files and the changelog section as notes.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" "build>=1.2,<2" "twine>=6,<7"
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import iamtrace; print(iamtrace.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - name: Changelog has a dated section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py "$TAG" > /dev/null
      - name: Checks
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest -q
      - name: Build
        run: |
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/iam-trace/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python scripts/release_notes.py "$TAG" > notes.md
          gh release create "$TAG" dist/* --repo "$REPO" --title "iam-trace ${TAG#v}" --notes-file notes.md
