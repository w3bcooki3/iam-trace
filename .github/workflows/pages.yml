# Publishes the static web page to GitHub Pages (free for public repositories).
# Enable it once under Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch the Pyodide runtime (bundled so the site loads no third-party code)
        run: |
          npm pack --silent pyodide@0.29.3
          # Pinned: the build fails if the registry serves anything other than this exact tarball.
          echo "924f3167d6bf5e553bda392615eaa82edd82a9cffc32a1cc49853a926b148c5c  pyodide-0.29.3.tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/pyodide" && tar -xzf pyodide-0.29.3.tgz -C "$RUNNER_TEMP/pyodide"
      - run: python scripts/build_web.py --pyodide "$RUNNER_TEMP/pyodide/package"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
