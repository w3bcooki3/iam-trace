# Live comparison against the AWS policy simulator. Manual only.
#
# Needs two repository secrets holding read-only credentials for an IAM user whose only
# permission is docs/differential-iam-policy.json:
#   AWS_DIFF_ACCESS_KEY_ID, AWS_DIFF_SECRET_ACCESS_KEY
# The simulator API is free. The run makes one API call per generated case (about 230).
name: differential

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Only run one category (blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e '.[differential]'
      - name: Compare with iam:SimulateCustomPolicy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DIFF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DIFF_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          CATEGORY: ${{ inputs.category }}
        run: |
          # The input arrives through the environment, never interpolated into the script.
          if [ -n "$CATEGORY" ]; then
            python -m tests.differential.runner --out tests/differential/fixtures --category "$CATEGORY" || true
          else
            python -m tests.differential.runner --out tests/differential/fixtures || true
          fi
      - name: Update README pass count
        run: python scripts/update_readme_counts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-fixtures
          path: tests/differential/fixtures
      - name: Open a pull request with new fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes."; exit 0
          fi
          branch="differential/$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tests/differential/fixtures README.md
          git commit -m "Record differential run results"
          git push origin "$branch"
          gh pr create --title "Differential run $(date +%Y-%m-%d)" \
            --body "Fixtures from the live comparison with iam:SimulateCustomPolicy. Open disagreements are marked status: open."
