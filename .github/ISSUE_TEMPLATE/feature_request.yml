name: Idea or feature request
description: Suggest something that would make iam-trace more useful.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to find out or do? "I couldn't tell whether X was safe" is the most useful kind of request.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: roadmap
    attributes:
      label: Related roadmap item
      description: If it matches an item in ROADMAP.md, which one.
