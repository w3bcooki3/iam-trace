# Keeps the SHA-pinned actions in the workflows up to date. Dependabot opens one grouped
# pull request a week; the pins stay SHAs, with the version in a comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /action
    schedule:
      interval: weekly
